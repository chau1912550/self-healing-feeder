in = ["docs/vi/study-guide.md"]

[[fact]]
id = "error_per_zone_table"
what = "README error-analysis table: faults, FNR, FPR, precision for the trunk zones"
expr = "[f\"| 1,125 | **{pct(pz['Sw1']['FNR'])}** | **{pct(pz['Sw1']['FPR'], 2)}** | {pct(pz['Sw1']['precision'])} |\".replace('1,125', comma(pz['Sw1']['n'])), f\"| {comma(pz['Sw2']['n'])} | {pct(pz['Sw2']['FNR'])} | {pct(pz['Sw2']['FPR'], 2)} | {pct(pz['Sw2']['precision'])} |\", f\"| {comma(pz['L13']['n'])} | {pct(pz['L13']['FNR'])} | {pct(pz['L13']['FPR'], 2)} | {pct(pz['L13']['precision'])} |\", f\"| {comma(pz['Sw4']['n'])} | {pct(pz['Sw4']['FNR'])} | {pct(pz['Sw4']['FPR'], 2)} | {pct(pz['Sw4']['precision'])} |\", f\"| {comma(pz['Sw3']['n'])} | {pct(pz['Sw3']['FNR'])} | {pct(pz['Sw3']['FPR'], 2)} | {pct(pz['Sw3']['precision'])} |\"]"
