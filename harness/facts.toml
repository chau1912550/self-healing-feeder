# Every number the project states in prose, tied to the result file it comes from.
#
# harness/check.py evaluates each `expr` against the latest results and checks that the
# formatted text appears in every file listed in `in`. When a re-run changes a result,
# the check fails and names the file and the text to update. Nothing here is typed by hand
# except the expression: the value always comes from the results.
#
# Names available in `expr`:
#   m    results/metrics.json
#   e    results/error_analysis/error_analysis.json
#   r    results/restoration.csv (list of rows, numbers converted)
#   mon  docs/monitor/data.json
#   h    results/hourly/hourly.json (hourly restoration study), None if it has not been run
#   sp   results/spice/summary.json (LTspice circuits), None if scripts/spice_run.py has not been run
#   faq  number of questions in shf/dashboard_text.py
#   tr2 tr2b tr3  results/transfer/phase2_ieee123.json, phase2b_bus_location.json, phase3_ieee34.json
#   tr37 tr2b37   results/transfer/phase3_ieee37.json, phase2b_bus_ieee37.json (urban underground IEEE 37-bus)
#   s2l  results/transfer/signal_to_load.json (scripts/signal_to_load.py)
#   pz   results/error_analysis/per_zone_ml.csv keyed by zone (numbers converted)
#   agds ag123 ag34 agconf  results/active_grid/dataset_summary.json, phase_active_ieee123.json, phase_active_ieee34.json, conformal_safety.json
#   agpost  results/active_grid/conformal_posthoc.json (scripts/active_conformal_posthoc.py)
#   ag37 ag37post  results/active_grid_ieee37/phase_active_ieee37.json, conformal_posthoc.json (None until Kaggle GPU run)
#   hif_ds hif_p123 hif_p34 hif_a123 hif_a34 hif_conf  results/hif_fusion/*.json (None until Kaggle GPU run)
#   defer  e['defer_low_confidence'] keyed by threshold, e.g. defer[0.95]['coverage']
#   pct(x, d=1)  0.977 -> "97.7%"      comma(n) -> "11,448"      f1(x) -> "39.0"
#
# An expression may return None when its result column only exists after the next
# `python run.py`; the check then warns instead of failing.
#
# To add a fact: copy a block, give it a new id, write the expression, list the files.

[[fact]]
id = "faults_total"
what = "Number of simulated faults"
expr = "comma(m['dataset']['rows'])"
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "zones"
what = "Number of switching zones"
expr = "str(m['base_case']['zones']) + ' zones'"
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "acc_fpi"
what = "Conventional fault indicator accuracy, all faults"
expr = "pct(m['fault_location']['fpi_baseline']['accuracy'])"
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "acc_ml_mag"
what = "ML accuracy, magnitudes only"
expr = "pct(m['fault_location']['ml_magnitude_only']['accuracy'])"
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "acc_ml_full"
what = "ML accuracy, full features (headline)"
expr = "pct(m['fault_location']['ml_full']['accuracy'])"
in = ["README.md", "docs/index.html", "docs/vi/study-guide.md"]

[[fact]]
id = "acc_table_100"
what = "Accuracy at 100 ohm SLG: FPI, ML magnitude, ML full"
expr = "[pct(m['fault_location'][k]['slg_by_resistance']['100.0']) for k in ('fpi_baseline', 'ml_magnitude_only', 'ml_full')]"
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "acc_table_400"
what = "Accuracy at 400 ohm SLG: FPI, ML magnitude, ML full"
expr = "[pct(m['fault_location'][k]['slg_by_resistance']['400.0']) for k in ('fpi_baseline', 'ml_magnitude_only', 'ml_full')]"
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "missing_sensor_range"
what = "ML accuracy with one device offline, worst to best"
expr = "f\"{round(100*min(m['fault_location']['ml_full']['missing_sensor_accuracy'].values()))}–{round(100*max(m['fault_location']['ml_full']['missing_sensor_accuracy'].values()))}%\""
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "fpi_bolted_slg"
what = "Conventional indicators on bolted (0.01 ohm) ground faults"
expr = "f\"({round(100*m['fault_location']['fpi_baseline']['slg_by_resistance']['0.01'])}% correct)\""
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "patrol"
what = "Patrol length: whole feeder, with ML zone"
expr = "[f1(m['patrol_kft']['no_location']) + ' kft', f1(m['patrol_kft']['ml_full']) + ' kft']"
in = ["README.md", "docs/index.html", "docs/vi/study-guide.md"]

[[fact]]
id = "patrol_cut"
what = "Patrol reduction with ML zone"
expr = "f\"−{round(100*(1 - m['patrol_kft']['ml_full']/m['patrol_kft']['no_location']))}%\""
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "ml_errors"
what = "ML errors and error share"
expr = "[f\"all {e['ml_errors']} errors\", pct(e['ml_errors']/e['faults'])]"
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "errors_high_r"
what = "Errors at 200 ohm or more"
expr = "f\"{e['ml_errors_slg_200_ohm_or_more']} ({round(100*e['ml_errors_slg_200_ohm_or_more']/e['ml_errors'])}%) are at 200 Ω or more\""
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "slg_error_rate_high_r"
what = "SLG error rate at 200 and 400 ohm"
expr = "[pct(e['ml_slg_error_rate_by_resistance']['200.0']) + ' at 200 Ω', pct(e['ml_slg_error_rate_by_resistance']['400.0']) + ' at 400 Ω']"
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "load_tercile"
what = "Error rate, lightest vs heaviest load third"
expr = "[pct(e['ml_error_rate_by_load_tercile']['low']) + ' in the lightest', pct(e['ml_error_rate_by_load_tercile']['high']) + ' in the heaviest']"
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "top_confusions"
what = "Three most common wrong-zone pairs"
expr = "[f\"{k.replace(' -> ', '→')} ({v})\" for k, v in list(e['ml_top_confusions'].items())[:3]]"
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "defer_095"
what = "Deferring predictions below 0.95 confidence"
expr = "[pct(1 - defer[0.95]['coverage']) + ' of faults', 'to ' + pct(defer[0.95]['accuracy_on_kept']), f\"to {defer[0.95]['errors_kept']}\"]"
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "fpi_no_flag"
what = "Faults where no conventional indicator raises a flag"
expr = "pct(m['fault_location']['fpi_baseline']['no_device_flagged'])"
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "rejected_pickups"
what = "Candidate tie pickups rejected by the power-flow check"
expr = "f\"rejected {sum(x['power_flow_rejected'] for x in r)} candidate pickups\" if 'power_flow_rejected' in r[0] else None"
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "kw_restored"
what = "Load restored through ties vs healthy load left dark"
expr = "f\"{comma(m['restoration']['kW_restored_by_tie_total'])} kW of the {comma(m['restoration']['kW_downstream_healthy_total'])} kW\""
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "kwmin_cut"
what = "Interrupted kW-minutes reduction, line-length weighted"
expr = "f\"fell by {round(m['restoration']['kWmin_reduction_pct_weighted_by_line_length'])}%\""
in = ["README.md", "docs/vi/study-guide.md"]

[[fact]]
id = "tour_kwmin"
what = "kW-minutes reduction quoted in the 30-second tour (one decimal)"
expr = "f\"{m['restoration']['kWmin_reduction_pct_weighted_by_line_length']:.1f}%\""
in = ["docs/index.html"]

[[fact]]
id = "tour_fpi"
what = "Conventional indicator accuracy quoted in the tour"
expr = "pct(m['fault_location']['fpi_baseline']['accuracy'])"
in = ["docs/index.html"]

[[fact]]
id = "faq_count"
what = "Questions in the report's Q&A"
expr = "f\"{faq} questions\""
in = ["README.md"]

[[fact]]
id = "monitor_ml"
what = "Monitor demo: ML and fault-indicator hits on its incidents"
expr = "f\"{sum(i['ml_top'][0]['zone'] == i['zone'] for i in mon['incidents'])} of {len(mon['incidents'])}\""
in = ["docs/monitor/README.md"]

[[fact]]
id = "monitor_card"
what = "Number of Monitor incidents quoted in the Monitor card on the report page"
expr = "f\"{len(mon['incidents'])} faults from this run\""
in = ["docs/index.html"]

[[fact]]
id = "hourly_year_mean"
what = "Hourly study: share of healthy dark load restored, averaged over every hour (at the fault hour, held for the outage)"
expr = "[pct(h['year']['pct_restored_mean']), pct(h['year']['pct_restored_held_mean'])]"
in = ["README.md", "docs/vi/module-guide.md"]

[[fact]]
id = "hourly_peak_compare"
what = "Restored share at peak load (restoration.csv), quoted next to the hourly mean"
expr = "pct(m['restoration']['kW_restored_by_tie_total'] / m['restoration']['kW_downstream_healthy_total'])"
in = ["README.md", "docs/vi/module-guide.md"]

[[fact]]
id = "hourly_held_lower"
what = "Hourly study: share of hours where the plan that must hold for the outage restores less"
expr = "pct(h['year']['share_hours_held_lower'])"
in = ["README.md"]

[[fact]]
id = "hourly_summer"
what = "Hourly study: typical summer day, best and worst fault hour"
expr = "[pct(max(h['typical_day']['summer']['pct_restored'])), '%02d:00' % h['typical_day']['summer']['pct_restored'].index(max(h['typical_day']['summer']['pct_restored'])), pct(min(h['typical_day']['summer']['pct_restored'])), '%02d:00' % h['typical_day']['summer']['pct_restored'].index(min(h['typical_day']['summer']['pct_restored']))]"
in = ["README.md", "docs/vi/module-guide.md"]

[[fact]]
id = "hourly_winter"
what = "Hourly study: typical winter day, best and worst fault hour"
expr = "[pct(max(h['typical_day']['winter']['pct_restored'])), '%02d:00' % h['typical_day']['winter']['pct_restored'].index(max(h['typical_day']['winter']['pct_restored'])), pct(min(h['typical_day']['winter']['pct_restored'])), '%02d:00' % h['typical_day']['winter']['pct_restored'].index(min(h['typical_day']['winter']['pct_restored']))]"
in = ["README.md", "docs/vi/module-guide.md"]

[[fact]]
id = "hourly_limits"
what = "Hourly study: hours on load levels where a state ends slightly above 1.05 pu, and that voltage"
expr = "[f\"{h['limits']['hours']} of {comma(h['load_shape']['hours'])} hours\", f\"{h['limits']['max_vmax_pu']:.4f} pu\"]"
in = ["README.md"]

[[fact]]
id = "hourly_limits_vi"
what = "Hourly study limits, as quoted in the Vietnamese guide"
expr = "[f\"{h['limits']['hours']} trên {comma(h['load_shape']['hours'])} giờ\", f\"{h['limits']['max_vmax_pu']:.4f} pu\"]"
in = ["docs/vi/module-guide.md"]

[[fact]]
id = "hourly_year"
what = "Hourly study: the year of PJM AEP load used"
expr = "f\"{comma(h['load_shape']['hours'])} hours of {h['load_shape']['year']}\""
in = ["README.md"]

[[fact]]
id = "spice_dc_offset"
what = "LTspice: bolted fault at bus 60, steady RMS, first peak with and without DC offset, time constant"
expr = "[comma(sp['fault_rms_a']['ltspice_steady']) + ' A RMS', comma(sp['first_peak']['max_offset']['peak_a']) + ' A', comma(sp['first_peak']['no_offset']['peak_a']) + ' A', f1(sp['model']['tau_ms']) + ' ms']"
in = ["README.md"]

[[fact]]
id = "spice_hif_400"
what = "LTspice: arcing vs fixed 400 ohm fault: RMS, 60 Hz share, 3rd harmonic, share of feeder-head load, that load, ADC counts"
expr = "[f\"{sp['hif']['cases']['400']['irms_arc']:.2f} A\", pct(sp['hif']['cases']['400']['i1_arc_vs_linear']), pct(sp['hif']['cases']['400']['h3_arc_pct'] / 100), pct(sp['hif']['cases']['400']['share_of_prefault_load_pct'] / 100), comma(sp['model']['i_pre']) + ' A', str(sp['hif']['cases']['400']['adc_counts_span_arc']) + ' counts']"
in = ["README.md"]

[[fact]]
id = "spice_hif_400_vi"
what = "LTspice arcing fault at 400 ohm, as quoted in the Vietnamese guide"
expr = "[pct(sp['hif']['cases']['400']['i1_arc_vs_linear']), pct(sp['hif']['cases']['400']['h3_arc_pct'] / 100), pct(sp['hif']['cases']['400']['share_of_prefault_load_pct'] / 100), str(sp['hif']['cases']['400']['adc_counts_span_arc']) + ' mức']"
in = ["docs/vi/module-guide.md"]

[[fact]]
id = "transfer_phase2_123"
