expr = "[pct(tr3['fpi']['accuracy']), pct(tr3['zero_shot']['per_node_gbdt']['accuracy']), pct(tr3['zero_shot']['gnn']['accuracy']), pct(tr3['few_shot']['pct_20']['models']['per_node_gbdt']['accuracy_mean']), pct(tr3['few_shot']['pct_20']['models']['gnn']['accuracy_mean'])]"
in = ["README.md", "docs/index.html", "docs/vi/study-guide.md", "docs/vi/module-guide.md"]

[[fact]]
