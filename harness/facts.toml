# Every number the project states in prose, tied to the result file it comes from.
#
# harness/check.py evaluates each `expr` against the latest results and checks that the
# formatted text appears in every file listed in `in`. When a re-run changes a result,
# the check fails and names the file and the text to update. Nothing here is typed by hand
# except the expression: the value always comes from the results.
#
# Names available in `expr`:
#   m    results/metrics.json
#   e    results/error_analysis/error_analysis.json
#   r    results/restoration.csv (list of rows, numbers converted)
#   mon  docs/monitor/data.json
#   faq  number of questions in shf/dashboard_text.py
#   defer  e['defer_low_confidence'] keyed by threshold, e.g. defer[0.95]['coverage']
#   pct(x, d=1)  0.977 -> "97.7%"      comma(n) -> "11,448"      f1(x) -> "39.0"
#
# An expression may return None when its result column only exists after the next
# `python run.py`; the check then warns instead of failing.
#
# To add a fact: copy a block, give it a new id, write the expression, list the files.

[[fact]]
id = "faults_total"
what = "Number of simulated faults"
expr = "comma(m['dataset']['rows'])"
in = ["README.md"]

[[fact]]
id = "zones"
what = "Number of switching zones"
expr = "str(m['base_case']['zones']) + ' zones'"
in = ["README.md"]

[[fact]]
id = "acc_fpi"
what = "Conventional fault indicator accuracy, all faults"
expr = "pct(m['fault_location']['fpi_baseline']['accuracy'])"
in = ["README.md"]

[[fact]]
id = "acc_ml_mag"
what = "ML accuracy, magnitudes only"
expr = "pct(m['fault_location']['ml_magnitude_only']['accuracy'])"
in = ["README.md"]

[[fact]]
id = "acc_ml_full"
what = "ML accuracy, full features (headline)"
expr = "pct(m['fault_location']['ml_full']['accuracy'])"
in = ["README.md", "docs/index.html"]

[[fact]]
id = "acc_table_100"
what = "Accuracy at 100 ohm SLG: FPI, ML magnitude, ML full"
expr = "[pct(m['fault_location'][k]['slg_by_resistance']['100.0']) for k in ('fpi_baseline', 'ml_magnitude_only', 'ml_full')]"
in = ["README.md"]

[[fact]]
id = "acc_table_400"
what = "Accuracy at 400 ohm SLG: FPI, ML magnitude, ML full"
expr = "[pct(m['fault_location'][k]['slg_by_resistance']['400.0']) for k in ('fpi_baseline', 'ml_magnitude_only', 'ml_full')]"
in = ["README.md"]

[[fact]]
id = "missing_sensor_range"
what = "ML accuracy with one device offline, worst to best"
expr = "f\"{round(100*min(m['fault_location']['ml_full']['missing_sensor_accuracy'].values()))}–{round(100*max(m['fault_location']['ml_full']['missing_sensor_accuracy'].values()))}%\""
in = ["README.md"]

[[fact]]
id = "fpi_bolted_slg"
what = "Conventional indicators on bolted (0.01 ohm) ground faults"
expr = "f\"({round(100*m['fault_location']['fpi_baseline']['slg_by_resistance']['0.01'])}% correct)\""
in = ["README.md"]

[[fact]]
id = "patrol"
what = "Patrol length: whole feeder, with ML zone"
expr = "[f1(m['patrol_kft']['no_location']) + ' kft', f1(m['patrol_kft']['ml_full']) + ' kft']"
in = ["README.md", "docs/index.html"]

[[fact]]
id = "patrol_cut"
what = "Patrol reduction with ML zone"
expr = "f\"−{round(100*(1 - m['patrol_kft']['ml_full']/m['patrol_kft']['no_location']))}%\""
in = ["README.md"]

[[fact]]
id = "ml_errors"
what = "ML errors and error share"
expr = "[f\"all {e['ml_errors']} errors\", pct(e['ml_errors']/e['faults'])]"
in = ["README.md"]

[[fact]]
id = "errors_high_r"
what = "Errors at 200 ohm or more"
expr = "f\"{e['ml_errors_slg_200_ohm_or_more']} ({round(100*e['ml_errors_slg_200_ohm_or_more']/e['ml_errors'])}%) are at 200 Ω or more\""
in = ["README.md"]

[[fact]]
id = "slg_error_rate_high_r"
what = "SLG error rate at 200 and 400 ohm"
expr = "[pct(e['ml_slg_error_rate_by_resistance']['200.0']) + ' at 200 Ω', pct(e['ml_slg_error_rate_by_resistance']['400.0']) + ' at 400 Ω']"
in = ["README.md"]

[[fact]]
id = "load_tercile"
what = "Error rate, lightest vs heaviest load third"
expr = "[pct(e['ml_error_rate_by_load_tercile']['low']) + ' in the lightest', pct(e['ml_error_rate_by_load_tercile']['high']) + ' in the heaviest']"
in = ["README.md"]

[[fact]]
id = "top_confusions"
what = "Three most common wrong-zone pairs"
expr = "[f\"{k.replace(' -> ', '→')} ({v})\" for k, v in list(e['ml_top_confusions'].items())[:3]]"
in = ["README.md"]

[[fact]]
id = "defer_095"
what = "Deferring predictions below 0.95 confidence"
expr = "[pct(1 - defer[0.95]['coverage']) + ' of faults', 'to ' + pct(defer[0.95]['accuracy_on_kept']), f\"to {defer[0.95]['errors_kept']}\"]"
in = ["README.md"]

[[fact]]
id = "fpi_no_flag"
what = "Faults where no conventional indicator raises a flag"
expr = "pct(m['fault_location']['fpi_baseline']['no_device_flagged'])"
in = ["README.md"]

[[fact]]
id = "rejected_pickups"
what = "Candidate tie pickups rejected by the power-flow check"
expr = "f\"rejected {sum(x['power_flow_rejected'] for x in r)} candidate pickups\" if 'power_flow_rejected' in r[0] else None"
in = ["README.md"]

[[fact]]
id = "kw_restored"
what = "Load restored through ties vs healthy load left dark"
expr = "f\"{comma(m['restoration']['kW_restored_by_tie_total'])} kW of the {comma(m['restoration']['kW_downstream_healthy_total'])} kW\""
in = ["README.md"]

[[fact]]
id = "kwmin_cut"
what = "Interrupted kW-minutes reduction, line-length weighted"
expr = "f\"fell by {round(m['restoration']['kWmin_reduction_pct_weighted_by_line_length'])}%\""
in = ["README.md"]

[[fact]]
id = "tour_kwmin"
what = "kW-minutes reduction quoted in the 30-second tour (one decimal)"
expr = "f\"{m['restoration']['kWmin_reduction_pct_weighted_by_line_length']:.1f}%\""
in = ["docs/index.html"]

[[fact]]
id = "tour_fpi"
what = "Conventional indicator accuracy quoted in the tour"
expr = "pct(m['fault_location']['fpi_baseline']['accuracy'])"
in = ["docs/index.html"]

[[fact]]
id = "faq_count"
what = "Questions in the report's Q&A"
expr = "f\"{faq} questions\""
in = ["README.md"]

[[fact]]
id = "monitor_ml"
what = "Monitor demo: ML and fault-indicator hits on its incidents"
expr = "f\"{sum(i['ml_top'][0]['zone'] == i['zone'] for i in mon['incidents'])} of {len(mon['incidents'])}\""
in = ["docs/monitor/README.md"]

# Phrases that must not appear: claims the project cannot back, or text about features
# that were removed. `files` defaults to the prose files (README, docs/*.md).
[[forbidden]]
text = "turns it off"
why = "The report's Explain mode is always on; there is no off button."

[[forbidden]]
text = "Control room demo"
why = "Renamed to Monitor (docs/monitor/)."

[[forbidden]]
text = "field-validated"
why = "Simulation only: no field data was used."

[[forbidden]]
text = "deployed at"
why = "Not deployed at any utility."

[[forbidden]]
text = "real-time SCADA"
why = "The MQTT/TimescaleDB path has not been run end to end."
