[[fact]]
id = "active_grid_34"
what = "Active-grid unseen IEEE 34-bus: FPI, zero-shot GBDT and GATv2, 20% few-shot GATv2 and GBDT, and in-domain GATv2 and GBDT"
expr = "[pct(ag34['fpi']['overall_accuracy']), pct(ag34['zero_shot']['per_node_gbdt']['overall_accuracy']), pct(ag34['zero_shot']['active_gatv2']['overall_accuracy']), pct(ag34['few_shot']['pct_20']['models']['active_gatv2']['overall_accuracy_mean']), pct(ag34['few_shot']['pct_20']['models']['per_node_gbdt']['overall_accuracy_mean']), pct(ag34['in_domain_upper_bound']['active_gatv2']['overall_accuracy']), pct(ag34['in_domain_upper_bound']['per_node_gbdt']['overall_accuracy'])]"
