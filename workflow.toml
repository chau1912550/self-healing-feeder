# Files made in other apps, and the exports the report uses.
#
# The study runs in Python + OpenDSS (run.py, scripts/). Other apps each have one job:
#
#   cad/      AutoCAD     2D drawings: one-line diagram of the feeder, wiring of a test bench
#   mech/     SolidWorks  3D parts: recloser and control cabinet, bench enclosure (export .glb for the 3D page)
#   spice/    LTspice     time-domain circuits OpenDSS does not model: fault DC offset, arcing faults, sensor front end
#   hmi/      Factory IO  virtual control panel driven over Modbus TCP, plus the Modbus address map
#   exports/  what the report and other tools read: PDF, SVG, DXF, GLB, STEP, CSV
#
# Rules
#   1. Numbers still come from results/. A drawing or circuit takes its values from the study
#      (bus names, line impedances, ratings) and never feeds numbers back into prose by hand.
#   2. Every file made in another app gets an [[asset]] entry below: where its source lives,
#      where its export goes, and which part of the report it supports.
#   3. After every export: python scripts/register_export.py <id>
#      harness/check.py fails if a source changes after its export, or an export is replaced
#      without registering it.
#   4. These are simulation and presentation aids. None of them is field equipment or field data.
#
#   5. Optional fields: `from` names a file Python generates for the app (re-import it when the
#      study changes); `planned = true` keeps a not-yet-made source as a reminder, not a failure.

# One-line diagram: python scripts/export_oneline_dxf.py writes cad/feeder_oneline.dxf from results/.
# python scripts/autocad_export.py --register then has AutoCAD (accoreconsole) save it as
# cad/feeder_oneline.dwg, plot layout "A3 ONE-LINE" to PDF (DWG To PDF.pc3) and PNG
# (PublishToWeb PNG.pc3), and register both exports. The same steps work by hand in AutoCAD.
[[asset]]
id = "oneline-pdf"
tool = "AutoCAD 2027"
from = "cad/feeder_oneline.dxf"
source = "cad/feeder_oneline.dwg"
export = "exports/feeder_oneline.pdf"
supports = "Report section 5: one-line diagram, PDF download"
planned = true

[[asset]]
id = "oneline-png"
tool = "AutoCAD 2027"
from = "cad/feeder_oneline.dxf"
source = "cad/feeder_oneline.dwg"
export = "exports/feeder_oneline.png"
supports = "Report section 5: one-line diagram shown on the page"
planned = true

# LTspice: python scripts/spice_run.py --register writes both schematics from the OpenDSS model,
# runs LTspice in batch mode and exports the waveforms (values in results/spice/summary.json).
[[asset]]
id = "spice-fault"
tool = "LTspice 26"
source = "spice/fault_dc_offset.asc"
export = "exports/spice_fault_current.csv"
supports = "Fault current at bus 60 with and without DC offset (time domain, vs the OpenDSS phasor)"

[[asset]]
id = "spice-ct"
tool = "LTspice 26"
source = "spice/ct_adc_frontend.asc"
export = "exports/spice_ct_adc.csv"
supports = "CT, burden, RC filter and clamps in front of a 3.3 V ADC, driven by the worst-case fault"

[[asset]]
id = "spice-hif"
tool = "LTspice 26"
source = "spice/hif_arc.asc"
export = "exports/spice_hif.csv"
supports = "Arcing high-impedance ground fault (two-diode model) vs the fixed resistance of the fault sweep, 100 and 400 ohm"

