name: Verify Provenance, Privacy, Tests & C Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Privacy & PII leak audit
        run: python scripts/privacy_audit.py

      - name: Verify Tier-2 SHA-256 provenance
        run: python -m shf.provenance

      - name: Verify Tier-1 HIF Sensor SHA-256 provenance & unit tests
        working-directory: hif_sensor
        run: |
          python -m hif.provenance --verify
          PYTHONPATH=. pytest -v tests/test_hif.py

      - name: Compile & verify C99 ESP32-S3 firmware bit-parity with GCC
        working-directory: hif_sensor
        run: |
          mkdir -p build
          gcc -O2 -Wall -Wextra -Werror -I firmware firmware/hif_infer.c firmware/test_infer.c -lm -o build/test_infer_p0
          ./build/test_infer_p0 results/test_vectors.json
          if [ -f firmware/hif_model_phase15.h ] && [ -f results/test_vectors_phase15.json ]; then
            gcc -O2 -Wall -Wextra -Werror -I firmware -DHIF_MODEL_HEADER=\"hif_model_phase15.h\" firmware/hif_infer.c firmware/test_infer.c -lm -o build/test_infer_p15
            ./build/test_infer_p15 results/test_vectors_phase15.json
          fi
          if [ -f firmware/hif_dsp.c ] && [ -f firmware/test_dsp.c ]; then
            gcc -O2 -Wall -Wextra -Werror -I firmware firmware/hif_dsp.c firmware/hif_infer.c firmware/test_dsp.c -lm -o build/test_dsp
            ./build/test_dsp
          fi

      - name: Run full health check, facts check, links, secrets & pytest suite
        run: python harness/check.py --tests
